name: Migration CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "airflow/**"
      - "dbt/**"
      - "glue/**"
      - "snowflake_ddl/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  PROJECT_NAME: ${{ secrets.MSSQL_PROJECT_NAME }}

jobs:
  # ─── PR validation: synth + validate only, no deploy ───────────────────────
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Read all Snowflake + bucket values from Secrets Manager (no long-lived secrets)
      - name: Load secrets from Secrets Manager
        run: |
          P="${PROJECT_NAME}"
          CREDS=$(aws secretsmanager get-secret-value \
            --secret-id "${P}/snowflake/creds" \
            --query SecretString --output text)
          echo "SNOWFLAKE_ACCOUNT=$(echo "$CREDS"    | jq -r .account)"             >> $GITHUB_ENV
          echo "SNOWFLAKE_USER=$(echo "$CREDS"        | jq -r .user)"               >> $GITHUB_ENV
          SF_PASS="$(echo "$CREDS" | jq -r .password)"
          echo "::add-mask::${SF_PASS}"
          echo "SNOWFLAKE_PASSWORD=${SF_PASS}"                                       >> $GITHUB_ENV
          echo "TF_VAR_aws_dms_bucket=$(echo "$CREDS" | jq -r .dms_bucket)"         >> $GITHUB_ENV
          echo "TF_VAR_aws_glue_bucket=$(echo "$CREDS" | jq -r .glue_bucket)"       >> $GITHUB_ENV
          echo "TF_VAR_aws_storage_integration_role_arn=$(echo "$CREDS" | jq -r .storage_iam_role_arn)" >> $GITHUB_ENV

      # CDK synth
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/aws-cdk/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra/aws-cdk
        run: npm ci

      - name: CDK synth
        working-directory: infra/aws-cdk
        env:
          MSSQL_PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: npx cdk synth --all --quiet

      # Terraform validate — Snowflake
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform init (Snowflake) — no backend
        working-directory: infra/terraform/snowflake
        run: terraform init -backend=false

      - name: Terraform validate (Snowflake)
        working-directory: infra/terraform/snowflake
        run: terraform validate

      # Terraform validate — AWS DMS
      - name: Terraform init (AWS DMS) — no backend
        working-directory: infra/terraform/aws
        run: terraform init -backend=false

      - name: Terraform validate (AWS DMS)
        working-directory: infra/terraform/aws
        run: terraform validate

      # dbt parse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-snowflake==1.8.0

      - name: dbt parse
        working-directory: dbt
        run: dbt parse --profiles-dir . --profile mssql_migration --target dev || true

  # ─── Deploy: merge to main ─────────────────────────────────────────────────
  deploy-main:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load secrets from Secrets Manager
        run: |
          P="${PROJECT_NAME}"
          CREDS=$(aws secretsmanager get-secret-value \
            --secret-id "${P}/snowflake/creds" \
            --query SecretString --output text)
          echo "SNOWFLAKE_ACCOUNT=$(echo "$CREDS"    | jq -r .account)"             >> $GITHUB_ENV
          echo "SNOWFLAKE_USER=$(echo "$CREDS"        | jq -r .user)"               >> $GITHUB_ENV
          SF_PASS="$(echo "$CREDS" | jq -r .password)"
          echo "::add-mask::${SF_PASS}"
          echo "SNOWFLAKE_PASSWORD=${SF_PASS}"                                       >> $GITHUB_ENV
          echo "SNOWFLAKE_ROLE=$(echo "$CREDS"        | jq -r .role)"               >> $GITHUB_ENV
          echo "TF_VAR_aws_dms_bucket=$(echo "$CREDS" | jq -r .dms_bucket)"         >> $GITHUB_ENV
          echo "TF_VAR_aws_glue_bucket=$(echo "$CREDS" | jq -r .glue_bucket)"       >> $GITHUB_ENV
          echo "TF_VAR_aws_storage_integration_role_arn=$(echo "$CREDS" | jq -r .storage_iam_role_arn)" >> $GITHUB_ENV

      # CDK deploy
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/aws-cdk/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra/aws-cdk
        run: npm ci

      - name: CDK deploy all stacks
        working-directory: infra/aws-cdk
        env:
          MSSQL_PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: npx cdk deploy --all --require-approval never

      # Snowflake Terraform apply
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform init (Snowflake)
        working-directory: infra/terraform/snowflake
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=snowflake/mssql-migration.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform apply (Snowflake)
        working-directory: infra/terraform/snowflake
        run: terraform apply -auto-approve

      # AWS DMS Terraform apply
      - name: Terraform init (AWS DMS)
        working-directory: infra/terraform/aws
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=aws-dms/mssql-migration.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform apply (AWS DMS)
        working-directory: infra/terraform/aws
        env:
          TF_VAR_project_name: ${{ env.PROJECT_NAME }}
        run: terraform apply -auto-approve
