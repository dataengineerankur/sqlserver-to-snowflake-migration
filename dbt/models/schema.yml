version: 2

# ────────────────────────────────────────────────────────────────────────────
# STAGING LAYER  (views over BRONZE — thin rename + type cast only)
# ────────────────────────────────────────────────────────────────────────────
models:

  # ── Orders / StressTest ──────────────────────────────────────────────────
  - name: stg_customers
    description: Staged customers from BRONZE.customers
    columns:
      - name: CUSTOMER_ID
        tests: [not_null, unique]
      - name: EMAIL
        tests: [not_null]

  - name: stg_products
    description: Staged products from BRONZE.products
    columns:
      - name: PRODUCT_ID
        tests: [not_null, unique]

  - name: stg_orders
    description: Staged orders from BRONZE.orders
    columns:
      - name: ORDER_ID
        tests: [not_null, unique]
      - name: CUSTOMER_ID
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: CUSTOMER_ID

  - name: stg_order_items
    description: Staged order line items from BRONZE.order_items
    columns:
      - name: ORDER_ITEM_ID
        tests: [not_null, unique]
      - name: ORDER_ID
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: ORDER_ID
      - name: PRODUCT_ID
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: PRODUCT_ID

  # ── ERP staging ──────────────────────────────────────────────────────────
  - name: stg_erp_departments
    description: Staged ERP departments from BRONZE.erp_departments
    columns:
      - name: DEPT_ID
        tests: [not_null, unique]

  - name: stg_erp_employees
    description: Staged ERP employees from BRONZE.erp_employees
    columns:
      - name: EMP_ID
        tests: [not_null, unique]

  - name: stg_erp_payroll_lines
    description: Staged payroll lines (denormalised with RUN_MONTH from payroll_runs)
    columns:
      - name: LINE_ID
        tests: [not_null, unique]
      - name: EMP_ID
        tests: [not_null]

  # ── CRM staging ──────────────────────────────────────────────────────────
  - name: stg_crm_accounts
    description: Staged CRM accounts from BRONZE.crm_accounts
    columns:
      - name: ACCOUNT_ID
        tests: [not_null, unique]

  - name: stg_crm_contacts
    description: Staged CRM contacts from BRONZE.crm_contacts
    columns:
      - name: CONTACT_ID
        tests: [not_null, unique]

  - name: stg_crm_opportunities
    description: Staged CRM opportunities from BRONZE.crm_opportunities
    columns:
      - name: OPP_ID
        tests: [not_null, unique]

  # ── Inventory staging ────────────────────────────────────────────────────
  - name: stg_inv_warehouses
    description: Staged warehouses from BRONZE.inv_warehouses
    columns:
      - name: WH_ID
        tests: [not_null, unique]

  - name: stg_inv_sku
    description: Staged SKU catalogue from BRONZE.inv_sku
    columns:
      - name: SKU_ID
        tests: [not_null, unique]

  - name: stg_inv_stock_movements
    description: Staged stock movement journal from BRONZE.inv_stock_movements
    columns:
      - name: MOV_ID
        tests: [not_null, unique]

# ────────────────────────────────────────────────────────────────────────────
# INTERMEDIATE LAYER  (views over SILVER snapshots — current records only)
# ────────────────────────────────────────────────────────────────────────────

  # ── Orders / StressTest ──────────────────────────────────────────────────
  - name: int_customers
    description: Current customer records from snp_customers (dbt_valid_to IS NULL)
    columns:
      - name: CUSTOMER_ID
        tests: [not_null, unique]

  - name: int_products
    description: Current product records from snp_products (dbt_valid_to IS NULL)
    columns:
      - name: PRODUCT_ID
        tests: [not_null, unique]

  - name: int_orders
    description: Current order state enriched with customer name / region
    columns:
      - name: ORDER_ID
        tests: [not_null, unique]

  - name: int_order_items
    description: Order line items enriched with product info (incremental append)
    columns:
      - name: ORDER_ITEM_ID
        tests: [not_null, unique]

  - name: int_orders_enriched
    description: Orders with derived fields (DAYS_TO_SHIP, ORDER_VALUE_TIER, IS_REPEAT_CUSTOMER)
    columns:
      - name: ORDER_ID
        tests: [not_null, unique]

  # ── ERP intermediate ─────────────────────────────────────────────────────
  - name: int_erp_employees
    description: Current employee records from snp_erp_employees joined to departments
    columns:
      - name: EMP_ID
        tests: [not_null, unique]

  - name: int_erp_payroll_lines
    description: Payroll lines enriched with employee + department (incremental append)
    columns:
      - name: LINE_ID
        tests: [not_null, unique]

  # ── CRM intermediate ─────────────────────────────────────────────────────
  - name: int_crm_accounts
    description: Current CRM account records from snp_crm_accounts
    columns:
      - name: ACCOUNT_ID
        tests: [not_null, unique]

  - name: int_crm_opportunities
    description: Current opportunities joined to int_crm_accounts for REGION
    columns:
      - name: OPP_ID
        tests: [not_null, unique]

  # ── Inventory intermediate ───────────────────────────────────────────────
  - name: int_inv_stock_movements
    description: Stock movements enriched with warehouse + SKU info (incremental append)
    columns:
      - name: MOV_ID
        tests: [not_null, unique]

# ────────────────────────────────────────────────────────────────────────────
# GOLD LAYER  (tables / incremental — BI-ready)
# ────────────────────────────────────────────────────────────────────────────

  # ── Dimensions ───────────────────────────────────────────────────────────
  - name: dim_customers
    description: Current customer dimension (full table refresh)
    columns:
      - name: CUSTOMER_ID
        tests: [not_null, unique]

  - name: dim_products
    description: Current product dimension with CATEGORY_NAME denormalised
    columns:
      - name: PRODUCT_ID
        tests: [not_null, unique]

  # ── Orders facts ─────────────────────────────────────────────────────────
  - name: fct_orders
    description: Order header facts with derived metrics (incremental merge)
    columns:
      - name: ORDER_ID
        tests: [not_null, unique]
      - name: CUSTOMER_ID
        tests:
          - relationships:
              to: ref('dim_customers')
              field: CUSTOMER_ID

  - name: fct_order_items
    description: Order line-item facts (incremental append)
    columns:
      - name: ORDER_ITEM_ID
        tests: [not_null, unique]
      - name: ORDER_ID
        tests:
          - relationships:
              to: ref('fct_orders')
              field: ORDER_ID
      - name: PRODUCT_ID
        tests:
          - relationships:
              to: ref('dim_products')
              field: PRODUCT_ID

  # ── ERP facts ────────────────────────────────────────────────────────────
  - name: fct_payroll_summary
    description: Monthly payroll totals by department (incremental merge)
    columns:
      - name: RUN_MONTH
        tests: [not_null]
      - name: DEPT_CODE
        tests: [not_null]

  # ── CRM facts ────────────────────────────────────────────────────────────
  - name: fct_crm_pipeline
    description: CRM pipeline summary by region + stage (incremental merge)
    columns:
      - name: REGION
        tests: [not_null]
      - name: STAGE
        tests: [not_null]

  # ── Inventory facts ──────────────────────────────────────────────────────
  - name: fct_inventory_position
    description: Current stock position per warehouse + SKU (incremental merge)
    columns:
      - name: WH_CODE
        tests: [not_null]
      - name: SKU_CODE
        tests: [not_null]

  # ── Audit ─────────────────────────────────────────────────────────────────
  - name: audit_ingestion
    description: Cross-domain ingestion health — latest _LOADED_AT per source table

  # ── Reports: orders domain ───────────────────────────────────────────────
  - name: rpt_order_line_detail
    description: >
      View replacing SnowConvertStressDB.dbo.vw_OrderLineDetail. Joins order
      items to orders, customers, products and categories. Read-only — inserts
      go to BRONZE.ORDER_ITEMS via the pipeline, not through this view.
    columns:
      - name: ORDER_ID
        tests: [not_null]
      - name: LINE_TOTAL
        tests: [not_null]

  - name: rpt_open_orders
    description: >
      View replacing SnowConvertStressDB.dbo.usp_ListOpenOrders. Returns all
      orders with STATUS = 'Open', enriched with customer name and days-open
      counter. Sorting is left to the consuming BI tool.
    columns:
      - name: ORDER_ID
        tests: [not_null]
      - name: STATUS
        tests:
          - not_null
          - accepted_values:
              values: ['Open']

  - name: rpt_customer_order_totals
    description: >
      Table replacing SnowConvertStressDB.dbo.vw_CustomerOrderTotals. One row
      per customer with order count, total spend, first/last order dates, and
      a formatted money string. Full rebuild on each dbt run.
    columns:
      - name: CUSTOMER_ID
        tests: [not_null, unique]
      - name: ORDER_COUNT
        tests: [not_null]
      - name: SUM_ORDER_TOTALS
        tests: [not_null]

  # ── Reports: categories ──────────────────────────────────────────────────
  - name: rpt_category_closure
    description: >
      Table replacing SnowConvertStressDB.dbo.usp_Stress_RecursiveCategoryClosure
      and its supporting dbo.CategoryClosure table. Uses a recursive CTE with
      the same synthetic edge rule (ABS(HASH(p,c)) % 3 = 0) and a depth cap
      of 5. In production use, replace synthetic edges with a real
      PARENT_CATEGORY_ID column on the categories table.
    columns:
      - name: ANCESTOR_ID
        tests: [not_null]
      - name: DESCENDANT_ID
        tests: [not_null]
      - name: DEPTH
        tests: [not_null]

  # ── Reports: inventory ───────────────────────────────────────────────────
  - name: rpt_stock_orders
    description: >
      View replacing LabInventory_DB.dbo.vw_StockOrders. Joins stock movements
      to warehouses and the current SKU snapshot row (dbt_valid_to IS NULL).
      The INSTEAD OF INSERT trigger on the original SQL Server view is replaced
      by BRONZE.SP_INV_SOFT_INSERT_STOCK_ORDER — callers must invoke that
      procedure directly rather than inserting through this view.
    columns:
      - name: MOV_ID
        tests: [not_null]
      - name: QTY_CHANGE
        tests: [not_null]

  # ── Calendar dimension ───────────────────────────────────────────────────
  - name: dim_date
    description: >
      Calendar dimension covering 2020-01-01 through 2034-12-31 (5479 rows).
      Generated entirely from Snowflake's GENERATOR function — no seed CSV
      needed. Replaces the manual DIM_DATE population that was flagged as
      incomplete in the original SQL Server database. Includes fiscal year,
      quarter, month attributes assuming a January fiscal year start.
    columns:
      - name: CALENDAR_DATE
        tests: [not_null, unique]
      - name: DATE_SK
        tests: [not_null, unique]
      - name: IS_WEEKEND
        tests: [not_null]
      - name: IS_WEEKDAY
        tests: [not_null]

# ────────────────────────────────────────────────────────────────────────────
# SNAPSHOTS  (SCD Type-2, target schema = SILVER)
# ────────────────────────────────────────────────────────────────────────────
snapshots:
  - name: snp_customers
    description: SCD2 snapshot of customers — tracks FULL_NAME, EMAIL, COUNTRY changes

  - name: snp_products
    description: SCD2 snapshot of products — tracks LIST_PRICE, PRODUCT_NAME, IS_ACTIVE changes

  - name: snp_orders
    description: SCD2 snapshot of orders — tracks STATUS, TOTAL_AMOUNT changes

  - name: snp_erp_employees
    description: SCD2 snapshot of ERP employees — tracks SALARY, DEPT_ID, FULL_NAME changes

  - name: snp_crm_accounts
    description: SCD2 snapshot of CRM accounts — tracks NAME, REGION changes

  - name: snp_crm_opportunities
    description: SCD2 snapshot of CRM opportunities — tracks STAGE, AMOUNT_USD, CLOSE_DATE changes

  - name: snp_inv_sku
    description: SCD2 snapshot of SKU catalogue — tracks DESCR, UNIT_COST changes
