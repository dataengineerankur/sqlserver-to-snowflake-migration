# Airflow (LocalExecutor) for the MSSQL → Snowflake migration lab.
# Uses a single postgres + scheduler + webserver — no Celery/Redis overhead.
#
# Usage:
#   cd sqlserver_aws_snowflake_migration/shared/airflow
#   echo "AIRFLOW_UID=$(id -u)" > .env        # macOS: use 50000 if id -u fails
#   docker compose up airflow-init            # initialises DB + admin user (once)
#   docker compose up -d                      # start scheduler + webserver
#   open http://localhost:8080                # admin / admin
#
# AWS credentials are injected from your host ~/.aws/ mount.
# Set AIRFLOW_VAR_DMS_BUCKET / AIRFLOW_VAR_GLUE_BUCKET if DAG needs them as Variables.

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: "migration-lab-secret"
    # Python path — lets DAGs import from plugins/ and sql/
    PYTHONPATH: "/opt/airflow/plugins:/opt/airflow/dags"
    # AWS — reuse host credentials (mounted below)
    AWS_PROFILE: test-migration
    AWS_DEFAULT_REGION: us-east-1
    # Airflow connections (overrides UI; edit as needed)
    AIRFLOW_CONN_AWS_DEFAULT: "aws:///?region_name=us-east-1&profile=test-migration"
    # Snowflake connection — set via .env file (copy .env.example → .env and fill in)
    AIRFLOW_CONN_SNOWFLAKE_DEFAULT: "snowflake://${SNOWFLAKE_USER}:${SNOWFLAKE_PASSWORD}@${SNOWFLAKE_ACCOUNT}/${SNOWFLAKE_DATABASE}/BRONZE?warehouse=${SNOWFLAKE_WAREHOUSE}&role=${SNOWFLAKE_ROLE}"
    # Variables used by the DAGs — set via .env file
    AIRFLOW_VAR_DMS_BUCKET: "${DMS_BUCKET}"
    AIRFLOW_VAR_GLUE_BUCKET: "${GLUE_BUCKET}"
  volumes:
    - ./dags:/opt/airflow/dags          # DAG files + dag_config.py
    - ./plugins:/opt/airflow/plugins    # snowflake_client.py and other helpers
    - ./sql:/opt/airflow/sql            # SQL files read by DAGs at runtime
    - ../dbt:/opt/airflow/dbt           # dbt project (for dbt run/test commands)
    - ../dbt:/opt/airflow/dbt_profiles  # profiles.yml lives here too
    - airflow-logs:/opt/airflow/logs
    # Mount host AWS credentials so the DAG can call AWS APIs
    - ${HOME}/.aws:/home/airflow/.aws:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com
        echo "Airflow initialised."
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

volumes:
  postgres-db-volume:
  airflow-logs:
  airflow-plugins:
